name: JobPulse v3 quality gates
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/jobpulse-v3-kage]
jobs:
  intelligence-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r services/intelligence/requirements-dev.txt
      - run: cd services/intelligence && python -m pytest -q
  nextjs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: cd apps/web && npm install --no-audit
      - run: cd apps/web && npm run typecheck
      - run: cd apps/web && npm run build
