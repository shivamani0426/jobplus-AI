name: JobPulse CI
on:
  push:
    branches: [main, saas-v2]
  pull_request:
    branches: [main, saas-v2]

jobs:
  api-tests:
    name: Python API and analysis tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and test dependencies
        run: python -m pip install -r requirements-api.txt pytest httpx
      - name: Run all unit tests
        run: python -m pytest tests -q

  frontend-build:
    name: React type-check and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend packages
        run: cd frontend && npm install
      - name: Type-check and build SaaS frontend
        run: cd frontend && npm run build
