name: JobPulse v3 quality gates
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/jobpulse-v3-kage, fix/auth-e2e]
jobs:
  intelligence-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r services/intelligence/requirements-dev.txt
      - run: cd services/intelligence && python -m pytest -q
  nextjs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: cd apps/web && npm install --no-audit
      - run: cd apps/web && npm run typecheck
      - run: cd apps/web && npm run build
  browser-e2e:
    runs-on: ubuntu-24.04
    needs: [intelligence-api, nextjs-build]
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_only
      INTELLIGENCE_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install -r services/intelligence/requirements-dev.txt
      - run: cd apps/web && npm install --no-audit
      - run: cd apps/web && npm run build
      - run: cd apps/web && npx playwright install --with-deps chromium
      - name: Generate synthetic PDF fixture (no personal data)
        run: |
          mkdir -p apps/web/tests/fixtures
          python - <<'PY'
          from reportlab.pdfgen.canvas import Canvas
          path = 'apps/web/tests/fixtures/sample-resume.pdf'
          canvas = Canvas(path)
          canvas.drawString(35, 720, 'Student projects using Python SQL Pandas statistics NumPy and Git')
          canvas.save()
          PY
      - name: Run desktop and mobile browser flows
        run: cd apps/web && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobpulse-browser-test-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7


  standby-browser-e2e:
    runs-on: ubuntu-24.04
    needs: [intelligence-api, nextjs-build]
    timeout-minutes: 18
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_only
      # The Python API may run on :8000, but Next.js uses an unreachable upstream
      # to verify that guest demo analysis and PDF exports still function.
      INTELLIGENCE_API_URL: http://127.0.0.1:7999
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install -r services/intelligence/requirements-dev.txt
      - run: cd apps/web && npm install --no-audit
      - run: cd apps/web && npm run build
      - run: cd apps/web && npx playwright install --with-deps chromium
      - name: Check local standby analyzer, demo forecast and PDF export
        run: cd apps/web && npx playwright test tests/standby.spec.ts --project chromium-desktop
