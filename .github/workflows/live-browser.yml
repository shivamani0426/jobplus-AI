name: JobPulse live website browser smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/live-browser.yml]
jobs:
  live-website:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PLAYWRIGHT_BASE_URL: https://jobpulse-v3-web.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install reportlab
      - run: cd apps/web && npm install --no-audit
      - run: cd apps/web && npx playwright install --with-deps chromium
      - name: Prepare synthetic resume (no personal data)
        run: |
          mkdir -p apps/web/tests/fixtures
          python - <<'PY'
          from reportlab.pdfgen.canvas import Canvas
          c = Canvas('apps/web/tests/fixtures/sample-resume.pdf')
          c.drawString(35,720,'Student projects using Python SQL Pandas statistics NumPy and Git')
          c.save()
          PY
      - name: Check live health before browser run
        run: |
          python - <<'PY'
          import time, urllib.request
          u='https://jobpulse-v3-web.onrender.com/api/health'
          for attempt in range(24):
              try:
                  with urllib.request.urlopen(u, timeout=25) as resp:
                      if resp.status == 200:
                          print('Public JobPulse health endpoint ready')
                          break
              except Exception as e:
                  print('Checking live readiness:', type(e).__name__)
              time.sleep(10)
          else:
              raise RuntimeError('Public JobPulse site did not respond to health check')
          PY
      - name: Run actual live website in desktop and mobile Chromium
        run: cd apps/web && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobpulse-live-browser-test-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
