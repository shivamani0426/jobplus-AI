name: JobPulse live website browser smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/live-browser.yml]
jobs:
  live-website:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PLAYWRIGHT_BASE_URL: https://jobpulse-v3-web.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install reportlab
      - run: cd apps/web && npm install --no-audit
      - run: cd apps/web && npx playwright install --with-deps chromium
      - name: Prepare synthetic resume (no personal data)
        run: |
          mkdir -p apps/web/tests/fixtures
          python - <<'PY'
          from reportlab.pdfgen.canvas import Canvas
          c = Canvas('apps/web/tests/fixtures/sample-resume.pdf')
          c.drawString(35,720,'Student projects using Python SQL Pandas statistics NumPy and Git')
          c.save()
          PY
      - name: Probe Python API and web proxy directly
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, time
          checks = {
              'python_direct': 'https://jobpulse-v3-intelligence.onrender.com/healthz',
              'web_to_python': 'https://jobpulse-v3-web.onrender.com/api/intelligence/v1/market?role_id=data-scientist&horizon=6'
          }
          results = {}
          for name,url in checks.items():
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(url,timeout=35) as response:
                          results[name] = response.status
                          print(name,'HTTP',response.status,response.read(240).decode('utf-8','replace'))
                          break
                  except urllib.error.HTTPError as err:
                      print(name,'HTTP',err.code,err.read(240).decode('utf-8','replace'))
                      results[name] = err.code
                  except Exception as err:
                      print(name,'connection error',type(err).__name__,str(err)[:140])
                      results[name] = 0
                  time.sleep(5)
          if any(status != 200 for status in results.values()):
              raise SystemExit('Live API probe failed; see status and response above')
          PY
      - name: Check optional OpenRouter coach status on live website
        run: |
          python - <<'PY'
          import json, urllib.request
          url = 'https://jobpulse-v3-web.onrender.com/api/ai/coach'
          with urllib.request.urlopen(url, timeout=40) as r:
              assert r.status == 200
              value = json.load(r)
          assert isinstance(value.get('configured'), bool)
          assert value.get('guest_access') is True
          assert 'OPENROUTER_API_KEY' not in value
          print('Public AI coach status available; configured:', value['configured'])
          PY
      - name: Check live guest resume analysis API
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://jobpulse-v3-web.onrender.com/api/intelligence/v1/analyze/text'
          payload=json.dumps({
              'role_id':'data-scientist',
              'text':'Synthetic university demo resume using Python SQL Pandas Git statistics and NumPy for data visualization projects.'
          }).encode()
          request=urllib.request.Request(url,data=payload,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(request,timeout=70) as response:
              assert response.status==200
              assert 'application/json' in response.headers.get('Content-Type','')
              result=json.load(response)
              assert result['role_id']=='data-scientist'
              assert result['score_type']=='weighted_keyword_alignment'
              assert any(s['skill']=='Python' for s in result['matched'])
              print('Public demo analysis passed. Processing mode:',response.headers.get('X-JobPulse-Mode','python-api'))
          PY
      - name: Check live health before browser run
        run: |
          python - <<'PY'
          import time, urllib.request
          u='https://jobpulse-v3-web.onrender.com/api/health'
          for attempt in range(24):
              try:
                  with urllib.request.urlopen(u, timeout=25) as resp:
                      if resp.status == 200:
                          print('Public JobPulse health endpoint ready')
                          break
              except Exception as e:
                  print('Checking live readiness:', type(e).__name__)
              time.sleep(10)
          else:
              raise RuntimeError('Public JobPulse site did not respond to health check')
          PY
      - name: Run actual live website in desktop and mobile Chromium
        run: cd apps/web && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobpulse-live-browser-test-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
